<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="ZIZIGO TOUR 상세 정보">
    <title>ZIZIGO TOUR - 상세</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background-color: #1a1a1a;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            color: #333;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .detail-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10vh;
            position: relative;
            background-image: url('images/detail-bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #e8e8e8;
            margin: 0 auto;
        }

        .back-btn-top {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #000;
            background: #fff;
            border: 3px solid #000;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow:
                0 4px 0 #000,
                0 6px 10px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
        }

        .back-btn-top:hover {
            transform: translateY(2px);
            box-shadow:
                0 2px 0 #000,
                0 4px 8px rgba(0, 0, 0, 0.3);
            background: #f5f5f5;
        }

        .back-btn-top:active {
            transform: translateY(4px);
            box-shadow:
                0 0px 0 #000,
                0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .contact-btn-top {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #000;
            background: #fff;
            border: 3px solid #000;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow:
                0 4px 0 #000,
                0 6px 10px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
        }

        .contact-btn-top:hover {
            transform: translateY(2px);
            box-shadow:
                0 2px 0 #000,
                0 4px 8px rgba(0, 0, 0, 0.3);
            background: #f5f5f5;
        }

        .contact-btn-top:active {
            transform: translateY(4px);
            box-shadow:
                0 0px 0 #000,
                0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .button-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 80%;
            width: 320px;
            z-index: 1;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* 환영 오버레이 */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            padding: 20px;
        }

        .welcome-overlay.hidden {
            display: none;
        }

        .welcome-message {
            text-align: center;
        }

        .welcome-message h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            line-height: 1.8;
            color: #333;
        }

        .welcome-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #000;
            background: #fff;
            border: 3px solid #000;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease, opacity 0.5s ease;
            box-shadow:
                0 5px 0 #000,
                0 8px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
        }

        .welcome-btn:hover {
            transform: translateY(2px);
            box-shadow:
                0 3px 0 #000,
                0 5px 10px rgba(0, 0, 0, 0.3);
            background: #f5f5f5;
        }

        .welcome-btn:active {
            transform: translateY(5px);
            box-shadow:
                0 0px 0 #000,
                0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* 안내문 오버레이 */
        .guideline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            touch-action: manipulation;
        }

        .guideline-overlay.show {
            display: flex;
        }

        .guideline-popup {
            background: #fff;
            border: 4px solid #333;
            border-radius: 15px;
            width: 85%;
            max-width: 500px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            touch-action: manipulation;
        }

        .guideline-header {
            padding: 20px 20px;
            border-bottom: 3px solid #333;
            text-align: center;
            flex-shrink: 0;
            position: relative;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-controls {
            position: absolute;
            left: 20px;
            display: flex;
            gap: 8px;
        }

        .zoom-btn {
            width: 32px;
            height: 32px;
            background: #000;
            color: #fff;
            border: 2px solid #000;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 0 #000, 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .zoom-btn:hover {
            transform: translateY(1px);
            box-shadow: 0 1px 0 #000, 0 2px 4px rgba(0, 0, 0, 0.2);
            background: #333;
        }

        .zoom-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 #000, 0 1px 2px rgba(0, 0, 0, 0.2);
            background: #000;
        }

        .zoom-hint {
            font-size: 10pt;
            color: #666;
            position: absolute;
            right: 60px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .guideline-header h2 {
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
        }

        .download-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            box-shadow: 0 2px 0 #000, 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .download-btn:hover {
            background: #f5f5f5;
            transform: translateY(-49%) translateY(-1px);
            box-shadow: 0 1px 0 #000, 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .download-btn:active {
            transform: translateY(-49%) translateY(1px);
            box-shadow: 0 0px 0 #000, 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .download-btn svg {
            width: 16px;
            height: 16px;
            fill: #000;
        }

        .guideline-content {
            overflow: auto;
            position: relative;
            height: 500px;
            background-color: #fff;
            touch-action: pan-x pan-y pinch-zoom;
        }

        .guideline-content img {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            object-fit: contain;
            object-position: top center;
            transition: transform 0.3s ease;
        }

        @media (max-width: 600px) {
            .guideline-popup {
                width: 95%;
                max-height: 90vh;
            }

            .guideline-header h2 {
                font-size: 1rem;
            }

            .guideline-content {
                height: 400px;
            }
        }

        .guideline-footer {
            padding: 15px 20px;
            border-top: 3px solid #333;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-wrapper label {
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .guideline-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #000;
            background: #fff;
            border: 3px solid #000;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow:
                0 5px 0 #000,
                0 8px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .guideline-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .guideline-btn:not(:disabled):hover {
            transform: translateY(2px);
            box-shadow:
                0 3px 0 #000,
                0 5px 10px rgba(0, 0, 0, 0.3);
            background: #f5f5f5;
        }

        .guideline-btn:not(:disabled):active {
            transform: translateY(5px);
            box-shadow:
                0 0px 0 #000,
                0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .vintage-btn {
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            color: #000;
            background: #fff;
            border: 3px solid #000;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow:
                0 5px 0 #000,
                0 8px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .vintage-btn:hover {
            transform: translateY(2px);
            box-shadow:
                0 3px 0 #000,
                0 5px 10px rgba(0, 0, 0, 0.3);
            background: #f5f5f5;
        }

        .vintage-btn:active {
            transform: translateY(5px);
            box-shadow:
                0 0px 0 #000,
                0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* 팝업 스타일 */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-overlay.show {
            display: flex;
        }

        .popup-content {
            background: #fff;
            border-radius: 15px;
            border: 4px solid #333;
            padding: 30px 25px;
            max-width: 85%;
            width: 420px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #333;
        }

        .popup-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #000;
            letter-spacing: 1px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            color: #000;
            transform: scale(1.2);
        }

        .popup-body {
            color: #333;
            font-size: 0.95rem;
            line-height: 1.8;
        }

        .popup-message {
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.7;
            color: #555;
        }

        .payment-info {
            background: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        .payment-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.9rem;
        }

        .payment-info-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .payment-label {
            font-weight: bold;
            color: #333;
        }

        .payment-value {
            color: #666;
            text-align: right;
        }

        .payment-notice {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
            font-size: 0.85rem;
            color: #d32f2f;
            font-weight: bold;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .back-btn-top {
                padding: 8px 16px;
                font-size: 0.8rem;
                top: 15px;
                left: 15px;
            }

            .button-wrapper {
                max-width: 90%;
                width: 90%;
            }

            .vintage-btn {
                padding: 12px 20px;
                font-size: 0.9rem;
            }

            .popup-content {
                padding: 25px 20px;
                width: 90%;
            }

            .popup-title {
                font-size: 1.1rem;
            }

            .close-btn {
                font-size: 1.5rem;
            }

            .popup-message {
                font-size: 0.9rem;
                margin-bottom: 25px;
            }

            .payment-info {
                padding: 15px;
            }

            .payment-info-item {
                font-size: 0.85rem;
                flex-direction: column;
                gap: 5px;
            }

            .payment-value {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <!-- 환영 오버레이 -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="welcome-message">
            <h2 id="welcomeText"></h2>
            <button class="welcome-btn" onclick="showGuideline()">안내문 확인하기</button>
        </div>
    </div>

    <!-- 안내문 PDF 오버레이 -->
    <div class="guideline-overlay" id="guidelineOverlay">
        <div class="guideline-popup">
            <div class="guideline-header">
                <div class="zoom-controls">
                    <button class="zoom-btn" onclick="zoomOut()">-</button>
                    <button class="zoom-btn" onclick="zoomIn()">+</button>
                </div>
                <span class="zoom-hint">더 크게 볼 수 있어요 →</span>
                <a href="안내문.pdf" target="_blank" class="download-btn" title="안내문 다운로드">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-6 4h12v2H6v-2z"/>
                    </svg>
                </a>
            </div>
            <div class="guideline-content">
                <img id="guidelineImage" src="안내문.png" alt="ZIZIGO TOUR 안내문">
            </div>
            <div class="guideline-footer">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="guidelineCheck" onchange="toggleConfirmButton()">
                    <label for="guidelineCheck">안내문을 모두 숙지했습니다.</label>
                </div>
                <button class="guideline-btn" id="confirmBtn" onclick="closeGuideline()" disabled>확인하기</button>
            </div>
        </div>
    </div>

    <div class="detail-container">
        <button class="back-btn-top" onclick="goToHome()">← 뒤로가기</button>
        <button class="contact-btn-top" onclick="openContactPopup()">문의하기</button>

        <div class="button-wrapper">
            <button class="vintage-btn" onclick="goToSchedule()">투어 일정표 보기</button>
            <button class="vintage-btn" onclick="openPaymentPopup()">투어비 입금 안내</button>
        </div>
    </div>

    <!-- 투어비 입금 팝업 -->
    <div class="popup-overlay" id="paymentPopup">
        <div class="popup-content">
            <div class="popup-header">
                <div class="popup-title">투어비 입금하기</div>
                <button class="close-btn" onclick="closePaymentPopup()">&times;</button>
            </div>
            <div class="popup-body">
                <div class="popup-message">
                    여러분들이 떠나게 될 결혼행 투어,<br>
                    평생 기억에 남을 특별한 추억이 될 거예요.
                </div>
                <div class="payment-info">
                    <div class="payment-info-item">
                        <span class="payment-label">입금 금액</span>
                        <span class="payment-value">100,000원</span>
                    </div>
                    <div class="payment-info-item">
                        <span class="payment-label">은행</span>
                        <span class="payment-value">토스뱅크</span>
                    </div>
                    <div class="payment-info-item">
                        <span class="payment-label">계좌번호</span>
                        <span class="payment-value">1000-0071-5841</span>
                    </div>
                    <div class="payment-info-item">
                        <span class="payment-label">예금주</span>
                        <span class="payment-value">안예지</span>
                    </div>
                </div>
                <div class="payment-notice">
                    * 초대장 수신 후 3일 이내에 신속히 입금해주시기 바랍니다. 입금 후 지지고 투어에서 발송되는 입금 확인 문자를 받으셔야 최종 결혼행 투어가 확정됩니다. *
                </div>
            </div>
        </div>
    </div>

    <!-- 문의하기 팝업 -->
    <div class="popup-overlay" id="contactPopup">
        <div class="popup-content">
            <div class="popup-header">
                <div class="popup-title">문의하기</div>
                <button class="close-btn" onclick="closeContactPopup()">&times;</button>
            </div>
            <div class="popup-body">
                <div class="popup-message">
                    지지고 투어는 따로 문의를 받고 있지 않습니다.
                </div>
            </div>
        </div>
    </div>

    <script>
        // 이미지 확대/축소
        let currentZoom = 1;
        const minZoom = 0.5;
        const maxZoom = 3;
        const zoomStep = 0.25;

        function zoomIn() {
            const img = document.getElementById('guidelineImage');
            if (currentZoom < maxZoom) {
                currentZoom += zoomStep;
                img.style.transform = `scale(${currentZoom})`;
                img.style.transformOrigin = 'top center';
            }
        }

        function zoomOut() {
            const img = document.getElementById('guidelineImage');
            if (currentZoom > minZoom) {
                currentZoom -= zoomStep;
                img.style.transform = `scale(${currentZoom})`;
                img.style.transformOrigin = 'top center';
            }
        }

        // 타이핑 애니메이션
        function typeWriter(element, text, speed = 50, callback) {
            let i = 0;
            element.innerHTML = '';

            function type() {
                if (i < text.length) {
                    if (text.substr(i, 4) === '<br>') {
                        element.innerHTML += '<br>';
                        i += 4;
                    } else {
                        element.innerHTML += text.charAt(i);
                        i++;
                    }
                    setTimeout(type, speed);
                } else {
                    // 타이핑 완료 후 콜백 실행
                    if (callback) callback();
                }
            }

            type();
        }

        // 페이지 로드 시 안내문 노출 여부 확인 및 타이핑 애니메이션 시작
        window.addEventListener('load', function() {
            // 안내문을 이미 본 경우 웰컴 오버레이 표시하지 않음
            if (sessionStorage.getItem('guidelineShown') === 'true') {
                document.getElementById('welcomeOverlay').style.display = 'none';
            } else {
                // 처음 진입한 경우 타이핑 애니메이션 시작
                const welcomeText = document.getElementById('welcomeText');
                if (welcomeText) {
                    typeWriter(welcomeText, '지지고 투어에 오신 걸 환영해요!<br>결혼행 투어 안내문을 먼저 읽어주세요', 50, function() {
                        // 타이핑 완료 후 버튼 표시
                        const welcomeBtn = document.querySelector('.welcome-btn');
                        if (welcomeBtn) {
                            welcomeBtn.style.opacity = '1';
                        }
                    });
                }
            }
        });

        function goToHome() {
            window.location.href = 'index.html';
        }

        function showGuideline() {
            document.getElementById('welcomeOverlay').classList.add('hidden');
            document.getElementById('guidelineOverlay').classList.add('show');
        }

        function toggleConfirmButton() {
            const checkbox = document.getElementById('guidelineCheck');
            const confirmBtn = document.getElementById('confirmBtn');
            confirmBtn.disabled = !checkbox.checked;
        }

        function closeGuideline() {
            document.getElementById('guidelineOverlay').classList.remove('show');
            // 안내문 확인 완료 표시 (같은 세션 내에서는 다시 표시하지 않음)
            sessionStorage.setItem('guidelineShown', 'true');
        }

        function openPaymentPopup() {
            document.getElementById('paymentPopup').classList.add('show');
        }

        function closePaymentPopup() {
            document.getElementById('paymentPopup').classList.remove('show');
        }

        function openContactPopup() {
            document.getElementById('contactPopup').classList.add('show');
        }

        function closeContactPopup() {
            document.getElementById('contactPopup').classList.remove('show');
        }

        function goToSchedule() {
            window.location.href = 'schedule.html';
        }

        // ESC 키로 팝업 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePaymentPopup();
                closeContactPopup();
            }
        });

        // 오버레이 클릭 시 팝업 닫기
        document.getElementById('paymentPopup').addEventListener('click', function(e) {
            if (e.target === this) {
                closePaymentPopup();
            }
        });

        document.getElementById('contactPopup').addEventListener('click', function(e) {
            if (e.target === this) {
                closeContactPopup();
            }
        });
    </script>
</body>
</html>
